<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Hagiography & Iconography Calendar of Female Saints</title>
  
  <!-- Liturgical & Byzantine Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="byzantine-theme">
  <!-- Top Global Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="byzantine-cross-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="cross-svg">
          <path d="M11 2h2v5h5v2h-5v4h3v2h-3v7h-2v-7H8v-2h3V9H6V7h5V2z" fill="currentColor"/>
          <circle cx="12" cy="8" r="1.5" fill="#F5D77F"/>
        </svg>
      </div>
      <div class="brand-titles">
        <h1 class="brand-main">THE HAGIOGRAPHY & ICONOGRAPHY CALENDAR</h1>
        <span class="brand-sub">OF FEMALE SAINTS • ECCLESIASTICAL CHRONOLOGY</span>
      </div>
    </div>

    <!-- Global Search & Quick Filters -->
    <div class="header-controls">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
          </svg>
        </span>
        <input 
          type="text" 
          id="saint-search-input" 
          placeholder="Search saint or manner of death..." 
          aria-label="Search saint name or cause of death"
          autocomplete="off"
        >
        <button id="search-clear-btn" class="clear-btn" aria-label="Clear search" style="display: none;">&times;</button>
      </div>

      <div class="view-indicator">
        <button type="button" class="today-gallery-btn" id="today-gallery-btn" title="Open Gallery Mode on Today's Saint">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
          <span id="today-gallery-btn-label">Today's Saint Gallery</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Strict 16:9 Landscape Layout (100vw x calc(100vh - 56px)) -->
  <main class="main-viewport">
    
    <!-- LEFT PANE: 60% Width Calendar Grid & Controls -->
    <section class="left-pane" aria-label="Calendar Grid and Navigation">
      <!-- Month Navigation & Filter Toolbar -->
      <div class="calendar-toolbar">
        <div class="month-nav">
          <button id="prev-month-btn" class="nav-arrow-btn" aria-label="Previous Month" title="Previous Month">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <div class="current-month-display">
            <select id="month-select" class="month-select-dropdown" aria-label="Select Liturgical Month">
              <option value="1">JANUARY</option>
              <option value="2">FEBRUARY</option>
              <option value="3">MARCH</option>
              <option value="4">APRIL</option>
              <option value="5">MAY</option>
              <option value="6">JUNE</option>
              <option value="7">JULY</option>
              <option value="8">AUGUST</option>
              <option value="9">SEPTEMBER</option>
              <option value="10">OCTOBER</option>
              <option value="11">NOVEMBER</option>
              <option value="12">DECEMBER</option>
            </select>
            <span class="year-num">2026</span>
          </div>
          <button id="next-month-btn" class="nav-arrow-btn" aria-label="Next Month" title="Next Month">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>

        <!-- Filter Chips Bar -->
        <div class="filter-chips-container">
          <!-- Martyrdom Status Filter -->
          <div class="filter-group" role="radiogroup" aria-label="Martyrdom Status Filter">
            <span class="filter-label">STATUS:</span>
            <button class="chip-btn active" data-filter="martyr" data-val="all">All</button>
            <button class="chip-btn martyr-chip" data-filter="martyr" data-val="martyr">
              <span class="chip-dot martyr-dot"></span> Martyrs
            </button>
            <button class="chip-btn non-martyr-chip" data-filter="martyr" data-val="non-martyr">
              <span class="chip-dot non-martyr-dot"></span> Venerable
            </button>
          </div>

          <!-- Tradition Filter -->
          <div class="filter-group" role="radiogroup" aria-label="Tradition Filter">
            <span class="filter-label">TRADITION:</span>
            <button class="chip-btn active" data-filter="tradition" data-val="all">All</button>
            <button class="chip-btn" data-filter="tradition" data-val="Eastern Orthodox">Orthodox</button>
            <button class="chip-btn" data-filter="tradition" data-val="Catholic">Catholic</button>
            <button class="chip-btn" data-filter="tradition" data-val="Shared">Shared</button>
          </div>
        </div>
      </div>

      <!-- 7-Column Liturgical Calendar Weekdays -->
      <div class="calendar-weekdays" aria-hidden="true">
        <div class="weekday-col">SUN</div>
        <div class="weekday-col">MON</div>
        <div class="weekday-col">TUE</div>
        <div class="weekday-col">WED</div>
        <div class="weekday-col">THU</div>
        <div class="weekday-col">FRI</div>
        <div class="weekday-col">SAT</div>
      </div>

      <!-- 7-Column Calendar Grid Container -->
      <div class="calendar-grid-wrapper">
        <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="Female Saints Calendar Grid">
          <!-- Calendar cells injected dynamically by app.js -->
        </div>
      </div>
    </section>

    <!-- RIGHT PANE: 40% Width Detailed Inspector Dossier -->
    <aside class="right-pane" id="inspector-pane" aria-label="Saint Inspector Dossier">
      <div class="dossier-container" id="dossier-content">
        <!-- Injected dynamically by app.js -->
        <div class="dossier-empty-state">
          <div class="empty-halo-ornament"></div>
          <p>Select a holy saint from the calendar to inspect her hagiographical dossier.</p>
        </div>
      </div>
    </aside>

  </main>

  <!-- Fullscreen Icon Gallery Modal -->
  <div class="gallery-modal-overlay" id="gallery-modal" role="dialog" aria-modal="true" aria-label="Sacred Iconography Gallery" hidden>
    <div class="gallery-modal-backdrop" id="gallery-backdrop"></div>
    <div class="gallery-modal-content">
      <button type="button" class="gallery-close-btn" id="gallery-close-btn" aria-label="Close Gallery (Esc)" title="Close Gallery (Esc)">
        &times;
      </button>

      <button type="button" class="gallery-nav-btn gallery-prev-btn" id="gallery-prev-btn" aria-label="Previous Day Saint" title="Previous Day Saint (Left Arrow)">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>

      <div class="gallery-stage" id="gallery-stage">
        <!-- Populated dynamically by app.js -->
      </div>

      <button type="button" class="gallery-nav-btn gallery-next-btn" id="gallery-next-btn" aria-label="Next Day Saint" title="Next Day Saint (Right Arrow)">
        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>
  </div>

  <!-- Ornate SVG Template Definitions (Hidden) -->
  <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FCEBA4"/>
        <stop offset="35%" stop-color="#D4AF37"/>
        <stop offset="70%" stop-color="#AA821C"/>
        <stop offset="100%" stop-color="#735508"/>
      </linearGradient>
      
      <linearGradient id="crimson-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#B71C1C"/>
        <stop offset="50%" stop-color="#8B0000"/>
        <stop offset="100%" stop-color="#4A0000"/>
      </linearGradient>
      
      <linearGradient id="dark-halo" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2D281E"/>
        <stop offset="100%" stop-color="#141418"/>
      </linearGradient>
    </defs>
  </svg>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
